<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aethel Chat Interface</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background-color: #000000;
            border-bottom: 1px solid #1a1a1a;
            position: relative;
            z-index: 10;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .menu-btn {
            background: none;
            border: none;
            color: #ffffff;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 20px;
            height: 14px;
        }

        .menu-btn span {
            display: block;
            height: 2px;
            width: 100%;
            background-color: #ffffff;
            border-radius: 2px;
        }

        .app-title {
            font-size: 16px;
            font-weight: 500;
            color: #ffffff;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
            color: #ffffff;
        }

        .header-right svg {
            width: 20px;
            height: 20px;
            cursor: pointer;
            fill: currentColor;
        }

        .chat-container {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message-bubble {
            background-color: #1a1a1a;
            color: #ffffff;
            padding: 12px 16px;
            border-radius: 16px;
            max-width: 85%;
            font-size: 14px;
            align-self: flex-start;
            border-top-left-radius: 4px;
        }

        .input-footer {
            padding: 12px 16px 24px 16px;
            background-color: #000000;
        }

        .input-bar {
            display: flex;
            align-items: center;
            background-color: #121212;
            border-radius: 28px;
            padding: 8px 12px;
            border: 1px solid #222222;
        }

        .plus-btn {
            background: none;
            border: none;
            color: #888888;
            font-size: 20px;
            cursor: pointer;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .plus-btn:hover {
            color: #ffffff;
            background-color: #222222;
        }

        .input-bar input {
            flex: 1;
            background: none;
            border: none;
            color: #ffffff;
            font-size: 15px;
            padding: 0 12px;
            outline: none;
        }

        .input-bar input::placeholder {
            color: #666666;
        }

        .mic-btn {
            background: none;
            border: none;
            color: #888888;
            cursor: pointer;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 4px;
        }

        .mic-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .profile-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            overflow: hidden;
            background-color: #333333;
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .overlay-menu {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #141416;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            padding: 20px 16px;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.8);
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
            z-index: 100;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
        }

        .overlay-menu.active {
            transform: translateY(0);
        }

        .action-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid #222226;
        }

        .action-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #1c1c21;
            border: none;
            border-radius: 16px;
            padding: 12px 4px;
            color: #ffffff;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .action-item:hover {
            background-color: #2a2a32;
        }

        .action-icon {
            width: 24px;
            height: 24px;
            margin-bottom: 6px;
            fill: #a0a0b0;
        }

        .action-label {
            font-size: 11px;
            color: #cccccc;
        }

        .agent-section-title {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.8px;
            color: #777788;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .agent-list {
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-height: 40vh;
            padding-right: 4px;
        }

        .agent-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 8px;
            border-radius: 12px;
            background: none;
            border: none;
            width: 100%;
            text-align: left;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .agent-item:hover {
            background-color: #1c1c21;
        }

        .agent-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            background-color: #333333;
        }

        .agent-name {
            font-size: 15px;
            font-weight: 500;
            color: #ffffff;
        }

        .backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 90;
        }

        .backdrop.active {
            opacity: 1;
            pointer-events: auto;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <button class="menu-btn" aria-label="Menu">
                <span></span>
                <span></span>
            </button>
            <span class="app-title">Aethel</span>
        </div>
        <div class="header-right">
            <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg>
            <svg viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2zm0 15l-5-2.18L7 18V5h10v13z"/></svg>
            <svg viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
        </div>
    </header>

    <main class="chat-container">
        <div class="message-bubble">
            Hello! I'm Aethel. How can I help you today?
        </div>
    </main>

    <div class="input-footer">
        <div class="input-bar">
            <button class="plus-btn" id="plusBtn" aria-label="Add Attachment">+</button>
            <input type="text" placeholder="Ask Aethel..." aria-label="Chat input">
            <button class="mic-btn" aria-label="Voice input">
                <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
            </button>
            <div class="profile-avatar" id="avatarBtn" aria-label="User profile">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop&crop=faces" alt="Profile">
            </div>
        </div>
    </div>

    <div class="backdrop" id="backdrop"></div>
    
    <div class="overlay-menu" id="overlayMenu">
        <div class="action-grid">
            <button class="action-item">
                <svg class="action-icon" viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
                <span class="action-label">Photos</span>
            </button>
            <button class="action-item">
                <svg class="action-icon" viewBox="0 0 24 24"><path d="M12 15c1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3 1.34 3 3 3zM9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg>
                <span class="action-label">Camera</span>
            </button>
            <button class="action-item">
                <svg class="action-icon" viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
                <span class="action-label">Files</span>
            </button>
            <button class="action-item">
                <svg class="action-icon" viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
                <span class="action-label">Note</span>
            </button>
            <button class="action-item">
                <svg class="action-icon" viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
                <span class="action-label">Folders</span>
            </button>
        </div>

        <div class="agent-section-title">Switch Agent</div>
        <div class="agent-list">
            <button class="agent-item">
                <img class="agent-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop&crop=faces" alt="Aethel">
                <span class="agent-name">Aethel</span>
            </button>
            <button class="agent-item">
                <img class="agent-avatar" src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100&h=100&fit=crop&crop=faces" alt="Business Agent">
                <span class="agent-name">Business Agent</span>
            </button>
            <button class="agent-item">
                <img class="agent-avatar" src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=100&h=100&fit=crop&crop=faces" alt="Commercial Agent">
                <span class="agent-name">Commercial Agent</span>
            </button>
            <button class="agent-item">
                <img class="agent-avatar" src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100&h=100&fit=crop&crop=faces" alt="Innovative Agent">
                <span class="agent-name">Innovative Agent</span>
            </button>
            <button class="agent-item">
                <img class="agent-avatar" src="https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=100&h=100&fit=crop&crop=faces" alt="Office Agent">
                <span class="agent-name">Office Agent</span>
            </button>
            <button class="agent-item">
                <img class="agent-avatar" src="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=100&h=100&fit=crop&crop=faces" alt="Social Media Agent">
                <span class="agent-name">Social Media Agent</span>
            </button>
            <button class="agent-item">
                <img class="agent-avatar" src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=100&h=100&fit=crop&crop=faces" alt="System Agent">
                <span class="agent-name">System Agent</span>
            </button>
        </div>
    </div>

    <script>
        const plusBtn = document.getElementById('plusBtn');
        const overlayMenu = document.getElementById('overlayMenu');
        const backdrop = document.getElementById('backdrop');

        function toggleMenu() {
            overlayMenu.classList.toggle('active');
            backdrop.classList.toggle('active');
        }

        plusBtn.addEventListener('click', toggleMenu);
        backdrop.addEventListener('click', toggleMenu);
    </script>
</body>
</html>
