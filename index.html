<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3KIG Command Center</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 16px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e293b;
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 1.2rem;
            margin: 0;
        }
        .status-pill {
            background: #166534;
            color: #dcfce7;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .quick-actions {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            overflow-x: auto;
            padding-bottom: 4px;
        }
        .chip {
            background: #334155;
            color: #f8fafc;
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            white-space: nowrap;
        }
        .chip:active {
            background: #475569;
        }
        .log-container {
            background: #1e293b;
            border-radius: 12px;
            padding: 12px;
            height: 60vh;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.85rem;
        }
        .log-entry {
            padding: 6px 0;
            border-bottom: 1px solid #334155;
        }
        .log-entry.success { color: #4ade80; }
        .log-entry.error { color: #f87171; }
    </style>
</head>
<body>

    <header>
        <h1>3KIG Command Center</h1>
        <span class="status-pill" id="connection-status">Online (Supabase)</span>
    </header>

    <div class="quick-actions">
        <button class="chip" onclick="logCommand('PING_SYSTEM')">Ping System</button>
        <button class="chip" onclick="logCommand('SYNC_DIRECTORY')">Sync Directory</button>
        <button class="chip" onclick="logCommand('DEPLOY_CHECK')">Deploy Check</button>
    </div>

    <div class="log-container" id="log-list">
        <div class="log-entry">[System] Initializing Supabase client interface...</div>
    </div>

    <script>
        const SUPABASE_URL = 'https://lrogupgrnffypwlzqprr.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_Uxs8_2CBonnV1pwvyY9dZg_J9SJw';

        // Initialize Supabase Client safely
        let supabaseClient;
        try {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            document.getElementById('connection-status').className = 'status-pill';
            document.getElementById('connection-status').innerText = 'Online (Supabase)';
        } catch (e) {
            document.getElementById('connection-status').className = 'status-pill';
            document.getElementById('connection-status').style.background = '#991b1b';
            document.getElementById('connection-status').innerText = 'Offline (Init Error)';
        }

        async function logCommand(actionName) {
            const list = document.getElementById('log-list');
            const timestamp = new Date().toISOString();

            // Append locally first for instant feedback
            const localEntry = document.createElement('div');
            localEntry.className = 'log-entry';
            localEntry.innerText = `[${timestamp}] Executing: ${actionName}`;
            list.prepend(localEntry);

            try {
                const { data, error } = await supabaseClient
                    .from('command_logs')
                    .insert([{ action: actionName, created_at: timestamp }]);

                if (error) throw error;

                const successEntry = document.createElement('div');
                successEntry.className = 'log-entry success';
                successEntry.innerText = `[${timestamp}] Success: ${actionName} logged to DB.`;
                list.prepend(successEntry);
            } catch (err) {
                const errorEntry = document.createElement('div');
                errorEntry.className = 'log-entry error';
                errorEntry.innerText = `[${timestamp}] DB Error: ${err.message}`;
                list.prepend(errorEntry);
            }
        }
    </script>
</body>
</html>
