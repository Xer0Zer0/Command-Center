<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3KIG Command Center</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #f8fafc; padding: 16px; margin: 0; }
        header { display: flex; justify-content: space-between; background: #1e293b; padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; }
        .quick-actions { display: flex; gap: 8px; margin-bottom: 16px; }
        .chip { background: #334155; color: #fff; border: none; padding: 8px 14px; border-radius: 20px; cursor: pointer; }
        .console-output { background: #020617; border: 1px solid #1e293b; border-radius: 8px; padding: 12px; font-family: monospace; height: 300px; overflow-y: auto; }
    </style>
</head>
<body>
    <header><h2>3KIG Command Center</h2><span id="status">Ready</span></header>
    <div class="quick-actions">
        <button class="chip" id="btn-sync">Sync</button>
        <button class="chip" id="btn-deploy">Deploy</button>
        <button class="chip" id="btn-export">Export CSV</button>
    </div>
    <div class="console-output" id="console">System initialized...</div>
    <script>
        const sb = window.supabase.createClient('https://lrogupgrnffpwlzqprr.supabase.co','sb_publishable_Uxs8_2CBonnV1pwvY9dZg_J9SJLrUP');
        let logs = JSON.parse(localStorage.getItem('logs') || '[]');
        function logMsg(m) {
            const b = document.getElementById('console');
            b.innerHTML += `<br>[${new Date().toLocaleTimeString()}] ${m}`;
            b.scrollTop = b.scrollHeight;
        }
        async function act(name) {
            logMsg(name + '...');
            logs.unshift({id: Date.now(), time: new Date().toISOString(), action: name});
            localStorage.setItem('logs', JSON.stringify(logs));
            try {
                await Promise.race([
                    sb.from('command_logs').insert([{action: name}]),
                    new Promise((_, rej) => setTimeout(rej, 2000))
                ]);
                logMsg(name + ' -> Success');
            } catch(e) {
                logMsg(name + ' -> Saved Locally');
            }
        }
        function expCSV() {
            logMsg('Exporting CSV...');
            let csv = 'id,created_at,action\n';
            logs.forEach(r => csv += `${r.id},${r.time},"${r.action}"\n`);
            const b = document.getElementById('console');
            b.innerHTML += `<br><br><pre style="color:#38bdf8;background:#000;padding:8px">${csv}</pre>`;
            b.scrollTop = b.scrollHeight;
        }
        document.getElementById('btn-sync').onclick = () => act('SYNC');
        document.getElementById('btn-deploy').onclick = () => act('DEPLOY');
        document.getElementById('btn-export').onclick = expCSV;
    </script>
</body>
</html>
