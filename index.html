<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3KIG Command Center</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --border-color: #1f2937;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #10b981;
            --danger: #ef4444;
        }

        body {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h2 {
            color: var(--accent);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 10px 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--danger);
            margin-right: 8px;
        }

        .indicator.connected {
            background-color: var(--success);
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 600px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 6px;
        }

        .card h3 {
            margin-top: 0;
            font-size: 16px;
            color: var(--text-main);
        }

        input[type="text"] {
            width: calc(100% - 20px);
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px;
            border-radius: 4px;
            font-family: inherit;
            margin-bottom: 10px;
        }

        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            width: 100%;
        }

        button:hover {
            background: var(--accent-hover);
        }

        pre {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 4px;
            height: 200px;
            overflow-y: auto;
            font-size: 12px;
            color: var(--success);
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>3KIG Command Center</h2>
        
        <div class="status-bar">
            <div>
                <span id="status-indicator" class="indicator"></span>
                <span id="status-text">Connecting to Orchestrator...</span>
            </div>
            <div>Target: ws://127.0.0.1:8765</div>
        </div>

        <div class="grid">
            <div class="card">
                <h3>Telemetry Dispatcher</h3>
                <input type="text" id="action-input" placeholder="Action (e.g., ping, sync, audit)">
                <input type="text" id="payload-input" placeholder="Payload Data (JSON format or text)">
                <button onclick="sendTelemetry()">Send to Orchestrator</button>
            </div>

            <div class="card">
                <h3>System Quick Stats</h3>
                <p style="color: var(--text-muted); font-size: 13px;">
                    Environment: Native Termux<br>
                    Database: SQLite (WAL Mode)<br>
                    Supervisor: PM2 Active
                </p>
            </div>
        </div>

        <div class="card">
            <h3>Live Telemetry Stream & Logs</h3>
            <pre id="log-output">Initializing connection sequence...</pre>
        </div>
    </div>

    <script>
        let ws;
        const logOutput = document.getElementById('log-output');
        const statusIndicator = document.getElementById('status-indicator');
        const statusText = document.getElementById('status-text');

        function log(message) {
            const timestamp = new Date().toLocaleTimeString();
            logOutput.innerText += `\n[${timestamp}] ${message}`;
            logOutput.scrollTop = logOutput.scrollHeight;
        }

        function connectWebSocket() {
            ws = new WebSocket('ws://127.0.0.1:8765');

            ws.onopen = () => {
                statusIndicator.classList.add('connected');
                statusText.innerText = 'Connected to Aethel Core';
                log('WebSocket connection established successfully.');
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    log(`Received: ${JSON.stringify(data, null, 2)}`);
                } catch (e) {
                    log(`Received raw: ${event.data}`);
                }
            };

            ws.onerror = (error) => {
                log(`WebSocket Error: Check if orchestrator is online on port 8765.`);
            };

            ws.onclose = () => {
                statusIndicator.classList.remove('connected');
                statusText.innerText = 'Disconnected. Reconnecting in 3s...';
                log('Connection lost. Retrying...');
                setTimeout(connectWebSocket, 3000);
            };
        }

        function sendTelemetry() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                alert('WebSocket is not connected.');
                return;
            }

            const actionVal = document.getElementById('action-input').value.trim() || 'ping';
            const payloadVal = document.getElementById('payload-input').value.trim() || '{"status":"active"}';

            let parsedPayload;
            try {
                parsedPayload = JSON.parse(payloadVal);
            } catch (e) {
                parsedPayload = { data: payloadVal };
            }

            const message = {
                agent: 'Dashboard-UI',
                action: actionVal,
                payload: parsedPayload
            };

            ws.send(JSON.stringify(message));
            log(`Sent: ${JSON.stringify(message)}`);
        }

        // Initialize connection on load
        window.onload = () => {
            connectWebSocket();
        };
    </script>
</body>
    </html>
