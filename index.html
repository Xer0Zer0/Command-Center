<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aethel Mobile Layout Preview</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #121214;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }
        .phone-container {
            width: 100%;
            max-width: 410px;
            height: 840px;
            background-color: #0d0d0d;
            border-radius: 40px;
            border: 8px solid #2a2a2e;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            position: relative;
        }
        .status-bar {
            height: 35px;
            background-color: #0d0d0d;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            color: #fff;
            font-size: 12px;
        }
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 18px;
            background-color: #0d0d0d;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .plus-btn {
            width: 32px;
            height: 32px;
            background-color: #222226;
            color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }
        .badge-69 {
            width: 32px;
            height: 32px;
            background-color: #ff0055;
            color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: bold;
        }
        .app-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        .sparkle-icon {
            font-size: 42px;
            color: #ec4899;
            margin-bottom: 14px;
        }
        .greeting-text {
            font-size: 22px;
            font-weight: 500;
            color: #ffffff;
        }
        .app-footer {
            padding: 14px 18px 24px 18px;
            background-color: #0d0d0d;
        }
        .chat-bar {
            width: 100%;
            background-color: #161618;
            border: 1px solid #2a2a2e;
            border-radius: 32px;
            padding: 8px 10px 8px 16px;
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .chat-input {
            flex: 1;
            color: #777780;
            font-size: 15px;
            text-align: left;
        }
        .waveform-trigger {
            width: 38px;
            height: 38px;
            background-color: #2b2b30;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
        }
        .wbar {
            width: 3px;
            border-radius: 2px;
        }
        .wbar-1 { height: 10px; background-color: #3b82f6; }
        .wbar-2 { height: 16px; background-color: #ef4444; }
        .wbar-3 { height: 20px; background-color: #f59e0b; }
        .wbar-4 { height: 12px; background-color: #3b82f6; }
    </style>
</head>
<body>
    <div class="phone-container">
        <div class="status-bar">
            <span>9:07</span>
            <span>📶 🔋 84%</span>
        </div>
        <div class="app-header">
            <div class="header-left">
                <span>&#9776;</span>
                <span>Aethel &#9662;</span>
            </div>
            <div class="header-right">
                <div class="plus-btn">+</div>
                <div class="badge-69">69</div>
            </div>
        </div>
        <div class="app-body">
            <div class="sparkle-icon">&#10024;</div>
            <div class="greeting-text">What's next, 69?</div>
        </div>
        <div class="app-footer">
            <div class="chat-bar">
                <span style="color: #888890; font-size: 20px;">+</span>
                <span class="chat-input">Ask Aethel</span>
                <span style="color: #888890; font-size: 16px;">&#127908;</span>
                <div class="waveform-trigger">
                    <div class="wbar wbar-1"></div>
                    <div class="wbar wbar-2"></div>
                    <div class="wbar wbar-3"></div>
                    <div class="wbar wbar-4"></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
