<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aethel UI - Digital Contents</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #05050a;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            background-color: #05050a;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 16px;
            font-weight: 500;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .icon-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .avatar-badge {
            background-color: #e91e63;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
        }

        /* Main Content Area */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            overflow-y: auto;
            padding-bottom: 80px; /* Space for fixed chat box */
        }
        .sparkle-icon {
            font-size: 32px;
            color: #e91e63;
            margin-bottom: 16px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }
        h1 {
            font-size: 24px;
            font-weight: 400;
            color: #e0e0e0;
        }

        /* Fixed Bottom Chat Box */
        .chat-input-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #05050a;
            padding: 12px 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 100;
        }
        .chat-input-wrapper {
            flex: 1;
            background-color: #1a1a24;
            border-radius: 24px;
            display: flex;
            align-items: center;
            padding: 8px 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .chat-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 15px;
            outline: none;
        }
        .chat-input::placeholder {
            color: #888;
        }
        .action-btn {
            background: transparent;
            border: none;
            color: #aaa;
            font-size: 18px;
            cursor: pointer;
            padding: 4px;
        }
        .send-btn {
            background-color: #e91e63;
            color: white;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="header-left">
            <span>☰</span>
            <span>Aethel ▾</span>
        </div>
        <div class="header-right">
            <button class="icon-btn">+</button>
            <div class="avatar-badge">69</div>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <div class="sparkle-icon">✦</div>
        <h1>What's next, 69?</h1>
    </main>

    <!-- Chat Box Input Bar (Pinned to Bottom) -->
    <div class="chat-input-container">
        <button class="action-btn">＋</button>
        <div class="chat-input-wrapper">
            <input type="text" id="chatInput" class="chat-input" placeholder="Ask anything...">
            <button class="action-btn">🎙️</button>
        </div>
        <button class="send-btn" onclick="sendMessage()">➔</button>
    </div>

    <script>
        function sendMessage() {
            const input = document.getElementById('chatInput');
            const val = input.value.trim();
            if (val !== '') {
                alert('Dispatched: ' + val);
                input.value = '';
            } else {
                alert('Please type a message into the input bar first.');
            }
        }
    </script>
</body>
</html>
