<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aethel Command Center</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #111111;
            --border-color: #eaeaea;
            --tray-bg: #ffffff;
            --card-bg: #f8f9fa;
            --input-bg: #f1f3f5;
            --drawer-bg: #121212;
            --drawer-text: #ffffff;
            --drawer-sub: #888888;
        }

        [data-theme="dark"] {
            --bg-color: #0f0f0f;
            --text-color: #f1f1f1;
            --border-color: #222222;
            --tray-bg: #1a1a1a;
            --card-bg: #242424;
            --input-bg: #2a2a2a;
            --drawer-bg: #121212;
            --drawer-text: #ffffff;
            --drawer-sub: #888888;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        /* Header Navigation */
        header {
            display: flex;
            align-items: center;
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
            background-color: var(--bg-color);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
        }

        .menu-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 20px;
            height: 14px;
            padding: 0;
        }

        .menu-btn span {
            display: block;
            height: 2px;
            width: 100%;
            background-color: var(--text-color);
            border-radius: 2px;
        }

        .header-title {
            margin-left: 16px;
            font-size: 16px;
            font-weight: 500;
            color: var(--text-color);
        }

        /* Sliding Navigation Drawer */
        .drawer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease;
            z-index: 200;
        }

        .drawer-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .drawer {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100%;
            background-color: var(--drawer-bg);
            color: var(--drawer-text);
            transition: left 0.3s ease;
            z-index: 201;
            display: flex;
            flex-direction: column;
            padding: 24px 16px;
        }

        .drawer.active {
            left: 0;
        }

        .drawer-menu-list {
            list-style: none;
            margin-top: 20px;
            flex-grow: 1;
        }

        .drawer-menu-list li {
            padding: 12px 16px;
            margin-bottom: 8px;
            border-radius: 12px;
            background-color: #1e1e1e;
            cursor: pointer;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .drawer-recents-title {
            font-size: 11px;
            color: var(--drawer-sub);
            letter-spacing: 1px;
            margin: 20px 0 10px 4px;
        }

        .drawer-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 16px;
            border-top: 1px solid #222;
        }

        .user-profile {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #444;
            overflow: hidden;
        }

        .new-chat-btn {
            background-color: #ffffff;
            color: #000000;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }

        /* Main Viewport Content Area */
        main {
            flex-grow: 1;
            margin-top: 53px;
            margin-bottom: 180px;
            padding: 16px;
            overflow-y: auto;
        }

        /* Bottom Controls Container */
        .bottom-dock {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: var(--tray-bg);
            border-top: 1px solid var(--border-color);
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            padding: 12px 16px 24px 16px;
            box-shadow: 0 -4px 16px rgba(0,0,0,0.05);
            z-index: 90;
        }

        .tray-handle {
            width: 36px;
            height: 4px;
            background-color: #ccc;
            border-radius: 2px;
            margin: 0 auto 12px auto;
        }

        /* Operations Grid (5 Cards) */
        .operations-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }

        .op-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 10px 4px;
            text-align: center;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: transform 0.1s;
        }

        .op-card:active {
            transform: scale(0.96);
        }

        .op-card span {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-color);
        }

        /* Settings Sub-Panel */
        .settings-panel {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px 14px;
            margin-bottom: 12px;
            font-size: 13px;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 22px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            transition: 0.3s;
            border-radius: 22px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #000;
        }

        [data-theme="dark"] input:checked + .slider {
            background-color: #fff;
        }

        input:checked + .slider:before {
            transform: translateX(18px);
        }

        /* Prompt Bar */
        .prompt-bar {
            display: flex;
            align-items: center;
            background-color: var(--input-bg);
            border-radius: 28px;
            padding: 8px 12px;
            gap: 10px;
        }

        .prompt-close {
            background: none;
            border: none;
            color: #ff5252;
            font-size: 16px;
            cursor: pointer;
            padding: 4px;
        }

        .prompt-input {
            flex-grow: 1;
            background: none;
            border: none;
            outline: none;
            color: var(--text-color);
            font-size: 14px;
        }

        .prompt-input::placeholder {
            color: #888;
        }

        .prompt-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            padding: 4px;
        }

        .waveform {
            display: flex;
            align-items: center;
            gap: 2px;
            height: 14px;
        }

        .waveform span {
            display: block;
            width: 2px;
            background-color: #007aff;
            border-radius: 1px;
            animation: pulse 1.2s infinite ease-in-out;
        }

        .waveform span:nth-child(1) { height: 6px; animation-delay: 0.1s; }
        .waveform span:nth-child(2) { height: 12px; animation-delay: 0.3s; }
        .waveform span:nth-child(3) { height: 8px; animation-delay: 0.2s; }
        .waveform span:nth-child(4) { height: 14px; animation-delay: 0.4s; }

        @keyframes pulse {
            0%, 100% { transform: scaleY(0.5); }
            50% { transform: scaleY(1); }
        }
    </style>
</head>
<body data-theme="dark">

    <!-- Header Navigation -->
    <header>
        <button class="menu-btn" id="menuToggle" aria-label="Toggle Menu">
            <span></span>
            <span></span>
        </button>
        <div class="header-title" id="headerTitle">Aethel</div>
    </header>

    <!-- Sliding Navigation Drawer -->
    <div class="drawer-overlay" id="drawerOverlay"></div>
    <div class="drawer" id="drawer">
        <ul class="drawer-menu-list">
            <li onclick="selectMenu('Chats')">💬 Chats</li>
            <li onclick="selectMenu('Projects')">📁 Projects</li>
            <li onclick="selectMenu('Code')">&lt;/&gt; Code</li>
            <li onclick="selectMenu('Artifacts')">✨ Artifacts</li>
        </ul>
        <div class="drawer-recents-title">RECENTS</div>
        <div class="drawer-footer">
            <div class="user-profile"></div>
            <button class="new-chat-btn">+ New chat</button>
        </div>
    </div>

    <!-- Main Viewport Content -->
    <main>
        <!-- Dynamic conversational workspace content goes here -->
    </main>

    <!-- Bottom Operations & Prompt Dock -->
    <div class="bottom-dock">
        <div class="tray-handle"></div>
        
        <!-- Operations Grid (5 Cards) -->
        <div class="operations-grid">
            <div class="op-card" onclick="selectAgent('Alpha')">
                <span>🤖</span>
                <span>Agents</span>
            </div>
            <div class="op-card" onclick="triggerAction('Camera')">
                <span>📷</span>
                <span>Camera</span>
            </div>
            <div class="op-card" onclick="triggerAction('Media')">
                <span>🎬</span>
                <span>Media</span>
            </div>
            <div class="op-card" onclick="triggerAction('Storage')">
                <span>🗄️</span>
                <span>Storage</span>
            </div>
            <div class="op-card" onclick="toggleSettingsPanel()">
                <span>⚙️</span>
                <span>Setting</span>
            </div>
        </div>

        <!-- Settings Sub-Panel -->
        <div class="settings-panel" id="settingsPanel">
            <span>Dark/Light</span>
            <label class="switch">
                <input type="checkbox" id="themeToggle" checked onchange="switchTheme()">
                <span class="slider"></span>
            </label>
        </div>

        <!-- Prompt Bar -->
        <div class="prompt-bar">
            <button class="prompt-close" onclick="clearPrompt()">×</button>
            <input type="text" class="prompt-input" id="promptInput" placeholder="What's on your mind boss">
            <div class="prompt-actions">
                <button class="icon-btn" title="Voice Input">🎤</button>
                <div class="waveform">
                    <span></span><span></span><span></span><span></span>
                </div>
                <button class="icon-btn" title="Submit">➡️</button>
            </div>
        </div>
    </div>

    <script>
        // Drawer toggle logic
        const menuToggle = document.getElementById('menuToggle');
        const drawer = document.getElementById('drawer');
        const drawerOverlay = document.getElementById('drawerOverlay');

        function toggleDrawer() {
            drawer.classList.toggle('active');
            drawerOverlay.classList.toggle('active');
        }

        menuToggle.addEventListener('click', toggleDrawer);
        drawerOverlay.addEventListener('click', toggleDrawer);

        // Theme Switcher Logic
        function switchTheme() {
            const body = document.body;
            const themeToggle = document.getElementById('themeToggle');
            if (themeToggle.checked) {
                body.setAttribute('data-theme', 'dark');
            } else {
                body.setAttribute('data-theme', 'light');
            }
        }

        // Toggle Settings Sub-Panel visibility if needed
        function toggleSettingsPanel() {
            const panel = document.getElementById('settingsPanel');
            panel.style.display = panel.style.display === 'none' ? 'flex' : 'none';
        }

        // Dynamic Header Title Update when Agent is Selected
        function selectAgent(agentName) {
            const titleEl = document.getElementById('headerTitle');
            titleEl.textContent = agentName;
        }

        function clearPrompt() {
            document.getElementById('promptInput').value = '';
        }

        function selectMenu(section) {
            toggleDrawer();
        }

        function triggerAction(actionName) {
            console.log(actionName + " selected");
        }
    </script>
</body>
    </html>
