<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3KIG Command Center</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 16px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e293b;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
        }
        .quick-actions {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            overflow-x: auto;
            padding-bottom: 4px;
        }
        .chip {
            background: #334155;
            color: #f8fafc;
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            white-space: nowrap;
        }
        .chip:hover {
            background: #475569;
        }
        .console-output {
            background: #020617;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 12px;
            font-family: monospace;
            font-size: 0.9rem;
            height: 300px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <header>
        <h2>3KIG Command Center</h2>
        <span id="status-badge">Connected</span>
    </header>

    <div class="quick-actions">
        <button class="chip" onclick="runCommand('SYNC')">Sync Database</button>
        <button class="chip" onclick="runCommand('DEPLOY')">Trigger Deploy</button>
        <button class="chip" onclick="exportLogsCSV()">Export CSV</button>
    </div>

    <div class="console-output" id="console">
        System initialized. Ready for commands...
    </div>

    <script>
        // Paste your actual Supabase Project URL and Anon Key inside the quotes below:
        const SUPABASE_URL = 'https://your-project-id.supabase.co';
        const SUPABASE_KEY = 'your-actual-anon-key-here';
        
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function runCommand(actionName) {
            const consoleDiv = document.getElementById('console');
            consoleDiv.innerHTML += `<br>[${new Date().toLocaleTimeString()}] Executing: ${actionName}...`;
            
            const { error } = await supabase
                .from('command_logs')
                .insert([{ action: actionName }]);

            if (error) {
                consoleDiv.innerHTML += `<br><span style="color: #ef4444;">Error: ${error.message}</span>`;
            } else {
                consoleDiv.innerHTML += ` <span style="color: #22c55e;">Success</span>`;
            }
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        }

        async function exportLogsCSV() {
            console.log('Export triggered');
            const { data, error } = await supabase
                .from('command_logs')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error('Error fetching logs for export:', error);
                alert('Export failed: ' + error.message);
                return;
            }

            if (!data || data.length === 0) {
                alert('No logs available to export.');
                return;
            }

            const headers = ['id', 'created_at', 'action'];
            let csvContent = headers.join(',') + '\n';

            data.forEach(row => {
                const escapedAction = `"${(row.action || '').replace(/"/g, '""')}"`;
                const rowData = [row.id, row.created_at, escapedAction];
                csvContent += rowData.join(',') + '\n';
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.setAttribute('href', url);
            link.setAttribute('download', `command_logs_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
