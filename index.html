<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3KIG Command Center</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #f8fafc; padding: 16px; margin: 0; }
        header { display: flex; justify-content: space-between; background: #1e293b; padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; }
        .quick-actions { display: flex; gap: 8px; margin-bottom: 16px; }
        .chip { background: #334155; color: #fff; border: none; padding: 8px 14px; border-radius: 20px; cursor: pointer; }
        .console-output { background: #020617; border: 1px solid #1e293b; border-radius: 8px; padding: 12px; font-family: monospace; height: 300px; overflow-y: auto; }
    </style>
</head>
<body>
    <header><h2>3KIG Command Center</h2><span id="status">Ready</span></header>
    <div class="quick-actions">
        <button class="chip" id="btn-sync">Sync Database</button>
        <button class="chip" id="btn-deploy">Trigger Deploy</button>
        <button class="chip" id="btn-export">Export CSV</button>
    </div>
    <div class="console-output" id="console">System initialized...</div>

    <script>
        const sb = window.supabase.createClient(
            'https://lrogupgrnffpwlzqprr.supabase.co',
            'sb_publishable_Uxs8_2CBonnV1pwvY9dZg_J9SJLrUP'
        );

        let localLogs = JSON.parse(localStorage.getItem('command_logs_local') || '[]');

        async function logAction(action) {
            const box = document.getElementById('console');
            box.innerHTML += `<br>[${new Date().toLocaleTimeString()}] Executing ${action}...`;
            
            const newLog = { id: Date.now(), created_at: new Date().toISOString(), action };
            localLogs.unshift(newLog);
            localStorage.setItem('command_logs_local', JSON.stringify(localLogs));

            try {
                const timeout = new Promise((_, reject) => setTimeout(() => reject('timeout'), 3000));
                await Promise.race([sb.from('command_logs').insert([{ action }]), timeout]);
                box.innerHTML += ` <span style="color:#22c55e">Success</span>`;
            } catch (e) {
                box.innerHTML += ` <span style="color:#f59e0b">Logged Locally</span>`;
            }
            box.scrollTop = box.scrollHeight;
        }

        async function exportCSV() {
            const box = document.getElementById('console');
            box.innerHTML += `<br>[${new Date().toLocaleTimeString()}] Exporting CSV...`;
            box.scrollTop = box.scrollHeight;

            let data = localLogs;
            try {
                const timeout = new Promise((_, reject) => setTimeout(() => reject('timeout'), 3000));
                const res = await Promise.race([sb.from('command_logs').select('*').order('created_at', { ascending: false }), timeout]);
                if (res.data && res.data.length > 0) data = res.data;
            } catch (e) {
                // Uses local cache seamlessly if network/RLS blocks
            }

            let csv = 'id,created_at,action\n';
            data.forEach(r => csv += `${r.id},${r.created_at},"${(r.action || '').replace(/"/g, '""')}"\n`);
            
            box.innerHTML += `<br><br><strong>[CSV Export (${data.length} rows)]:</strong><br><pre style="color:#38bdf8; background:#000; padding:8px; border-radius:4px;">${csv}</pre>`;
            box.scrollTop = box.scrollHeight;
        }

        document.getElementById('btn-sync').onclick = () => logAction('SYNC');
        document.getElementById('btn-deploy').onclick = () => logAction('DEPLOY');
        document.getElementById('btn-export').onclick = exportCSV;
    </script>
</body>
</html>
