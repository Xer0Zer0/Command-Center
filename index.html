<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aethel Command Center</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #111111;
            --border-color: #eaeaea;
            --tray-bg: #ffffff;
            --card-bg: #f8f9fa;
            --input-bg: #f1f3f5;
            --drawer-bg: #121212;
            --drawer-text: #ffffff;
            --drawer-sub: #888888;
        }

        [data-theme="dark"] {
            --bg-color: #0f0f0f;
            --text-color: #f1f1f1;
            --border-color: #222222;
            --tray-bg: #161616;
            --card-bg: #222222;
            --input-bg: #222222;
            --drawer-bg: #121212;
            --drawer-text: #ffffff;
            --drawer-sub: #888888;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100dvh; /* Uses dynamic viewport height to handle mobile browser toolbars correctly */
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        /* Header Navigation */
        header {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            background-color: var(--bg-color);
            flex-shrink: 0;
            z-index: 100;
        }

        .menu-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 20px;
            height: 14px;
            padding: 0;
        }

        .menu-btn span {
            display: block;
            height: 2px;
            width: 100%;
            background-color: var(--text-color);
            border-radius: 2px;
        }

        /* Sliding Navigation Drawer */
        .drawer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease;
            z-index: 200;
        }

        .drawer-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .drawer {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100%;
            background-color: var(--drawer-bg);
            color: var(--drawer-text);
            transition: left 0.3s ease;
            z-index: 201;
            display: flex;
            flex-direction: column;
            padding: 24px 16px;
        }

        .drawer.active {
            left: 0;
        }

        .drawer-menu-list {
            list-style: none;
            margin-top: 20px;
            flex-grow: 1;
        }

        .drawer-menu-list li {
            padding: 12px 16px;
            margin-bottom: 8px;
            border-radius: 12px;
            background-color: #1e1e1e;
            cursor: pointer;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .drawer-recents-title {
            font-size: 11px;
            color: var(--drawer-sub);
            letter-spacing: 1px;
            margin: 20px 0 10px 4px;
        }

        .drawer-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 16px;
            border-top: 1px solid #222;
        }

        .user-profile {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #444;
            overflow: hidden;
        }

        .new-chat-btn {
            background-color: #ffffff;
            color: #000000;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }

        /* Main Viewport Content Area */
        main {
            flex-grow: 1;
            overflow-y: auto;
            padding: 16px;
        }

        /* Bottom Controls Container */
        .bottom-dock {
            flex-shrink: 0;
            background-color: var(--tray-bg);
            border-top: 1px solid var(--border-color);
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 8px 14px 12px 14px;
            box-shadow: 0 -4px 16px rgba(0,0,0,0.08);
            z-index: 90;
        }

        .tray-handle {
            width: 32px;
            height: 4px;
            background-color: #ccc;
            border-radius: 2px;
            margin: 0 auto 6px auto;
        }

        .section-label {
            font-size: 8px;
            font-weight: 600;
            letter-spacing: 1px;
            color: #888;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        /* Operations Grid (5 Cards) */
        .operations-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
            margin-bottom: 6px;
        }

        .op-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 6px 2px;
            text-align: center;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
        }

        .op-card span:last-child {
            font-size: 9px;
            font-weight: 500;
            color: var(--text-color);
        }

        /* Settings Sub-Panel */
        .settings-panel {
            display: none;
            align-items: center;
            justify-content: space-between;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 6px 10px;
            margin-bottom: 6px;
            font-size: 11px;
        }

        .settings-panel.active {
            display: flex;
        }

        .settings-label-inner {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-color);
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 34px;
            height: 18px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            transition: 0.3s;
            border-radius: 18px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 12px;
            width: 12px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #000;
        }

        [data-theme="dark"] input:checked + .slider {
            background-color: #fff;
        }

        input:checked + .slider:before {
            transform: translateX(16px);
            background-color: #000;
        }

        /* Prompt Bar */
        .prompt-bar {
            display: flex;
            align-items: center;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 26px;
            padding: 6px 12px;
            gap: 8px;
        }

        .prompt-close {
            display: none;
            background: none;
            border: none;
            color: #ff5252;
            font-size: 15px;
            cursor: pointer;
            align-items: center;
            padding: 0;
        }

        .prompt-close.active {
            display: flex;
        }

        .prompt-input {
            flex-grow: 1;
            background: none;
            border: none;
            outline: none;
            color: var(--text-color);
            font-size: 12px;
        }

        .prompt-input::placeholder {
            color: #888;
        }

        .prompt-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            padding: 2px;
            font-size: 13px;
        }

        /* Multi-color audio waveform */
        .waveform {
            display: flex;
            align-items: center;
            gap: 2px;
            height: 12px;
        }

        .waveform span {
            display: block;
            width: 2px;
            border-radius: 1px;
            animation: pulse 1.2s infinite ease-in-out;
        }

        .waveform span:nth-child(1) { background-color: #3b82f6; height: 5px; animation-delay: 0.1s; }
        .waveform span:nth-child(2) { background-color: #10b981; height: 10px; animation-delay: 0.3s; }
        .waveform span:nth-child(3) { background-color: #f59e0b; height: 7px; animation-delay: 0.2s; }
        .waveform span:nth-child(4) { background-color: #ec4899; height: 12px; animation-delay: 0.4s; }

        @keyframes pulse {
            0%, 100% { transform: scaleY(0.5); }
            50% { transform: scaleY(1); }
        }
    </style>
</head>
<body data-theme="dark">

    <!-- Header Navigation -->
    <header>
        <button class="menu-btn" id="menuToggle" aria-label="Toggle Menu">
            <span></span>
            <span></span>
        </button>
    </header>

    <!-- Sliding Navigation Drawer -->
    <div class="drawer-overlay" id="drawerOverlay"></div>
    <div class="drawer" id="drawer">
        <ul class="drawer-menu-list">
            <li onclick="selectMenu('Chats')">💬 Chats</li>
            <li onclick="selectMenu('Projects')">📁 Projects</li>
            <li onclick="selectMenu('Code')">&lt;/&gt; Code</li>
            <li onclick="selectMenu('Artifacts')">✨ Artifacts</li>
        </ul>
        <div class="drawer-recents-title">RECENTS</div>
        <div class="drawer-footer">
            <div class="user-profile"></div>
            <button class="new-chat-btn" onclick="activatePromptClose()">+ New chat</button>
        </div>
    </div>

    <!-- Main Viewport Content -->
    <main>
        <!-- Dynamic content area -->
    </main>

    <!-- Bottom Operations & Prompt Dock -->
    <div class="bottom-dock">
        <div class="tray-handle"></div>
        <div class="section-label">Operations</div>
        
        <!-- Operations Grid (5 Cards) -->
        <div class="operations-grid">
            <div class="op-card" onclick="triggerAction('Agents')">
                <span>🤖</span>
                <span>Agents</span>
            </div>
            <div class="op-card" onclick="triggerAction('Camera')">
                <span>📷</span>
                <span>Camera</span>
            </div>
            <div class="op-card" onclick="triggerAction('Media')">
                <span>🎬</span>
                <span>Media</span>
            </div>
            <div class="op-card" onclick="triggerAction('Storage')">
                <span>🗄️</span>
                <span>Storage</span>
            </div>
            <div class="op-card" onclick="toggleSettingsPanel()">
                <span>⚙️</span>
                <span>Setting</span>
            </div>
        </div>

        <div class="section-label">Setting</div>

        <!-- Settings Sub-Panel -->
        <div class="settings-panel" id="settingsPanel">
            <div class="settings-label-inner">
                <span>🌓</span>
                <span>Dark / Light Mode</span>
            </div>
            <label class="switch">
                <input type="checkbox" id="themeToggle" checked onchange="switchTheme()">
                <span class="slider"></span>
            </label>
        </div>

        <!-- Prompt Bar -->
        <div class="prompt-bar">
            <button class="prompt-close" id="promptCloseBtn" onclick="deactivatePromptClose()">×</button>
            <input type="text" class="prompt-input" id="promptInput" placeholder="What's on your mind boss">
            <div class="prompt-actions">
                <button class="icon-btn" title="Voice Input">🎤</button>
                <div class="waveform">
                    <span></span><span></span><span></span><span></span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const menuToggle = document.getElementById('menuToggle');
        const drawer = document.getElementById('drawer');
        const drawerOverlay = document.getElementById('drawerOverlay');

        function toggleDrawer() {
            drawer.classList.toggle('active');
            drawerOverlay.classList.toggle('active');
        }

        menuToggle.addEventListener('click', toggleDrawer);
        drawerOverlay.addEventListener('click', toggleDrawer);

        function switchTheme() {
            const body = document.body;
            const themeToggle = document.getElementById('themeToggle');
            if (themeToggle.checked) {
                body.setAttribute('data-theme', 'dark');
            } else {
                body.setAttribute('data-theme', 'light');
            }
        }

        function toggleSettingsPanel() {
            const panel = document.getElementById('settingsPanel');
            panel.classList.toggle('active');
        }

        function activatePromptClose() {
            toggleDrawer();
            document.getElementById('promptCloseBtn').classList.add('active');
        }

        function deactivatePromptClose() {
            document.getElementById('promptCloseBtn').classList.remove('active');
            document.getElementById('promptInput').value = '';
        }

        function selectMenu(section) {
            toggleDrawer();
            activatePromptClose();
        }

        function triggerAction(actionName) {
            console.log(actionName + " selected");
        }
    </script>
</body>
</html>
