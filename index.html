<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3KIG Command Center</title>
    <style>
        body { font-family: monospace; background: #0d1117; color: #c9d1d9; margin: 0; padding: 20px; }
        h2 { color: #58a6ff; }
        .card { background: #161b22; border: 1px solid #30363d; padding: 15px; border-radius: 6px; margin-bottom: 15px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 15px; }
        .metric { background: #010409; padding: 10px; border-radius: 4px; border: 1px solid #30363d; text-align: center; }
        .metric span { display: block; font-size: 18px; color: #7ee787; margin-top: 5px; }
        button { padding: 8px 12px; background: #21262d; color: #c9d1d9; border: 1px solid #30363d; border-radius: 6px; cursor: pointer; }
        button:hover { background: #30363d; }
        input[type="text"] { padding: 8px; background: #010409; color: #c9d1d9; border: 1px solid #30363d; border-radius: 4px; font-family: monospace; width: 100%; box-sizing: border-box; }
        pre { background: #010409; padding: 10px; border-radius: 4px; overflow-x: auto; color: #7ee787; max-height: 300px; }
    </style>
</head>
<body>
    <h2>3KIG Command Center</h2>
    
    <div class="grid">
        <div class="metric">Status<span id="stat-conn">Offline</span></div>
        <div class="metric">Dispatched<span id="stat-count">0</span></div>
        <div class="metric">Latency<span id="stat-latency">0ms</span></div>
        <div class="metric">Uptime<span id="stat-uptime">00:00</span></div>
    </div>

    <div class="card">
        <h3>Runtime Payload Injection</h3>
        <div style="margin-bottom: 10px;">
            <label style="font-size: 12px; color: #8b949e; display: block; margin-bottom: 5px;">Custom JSON Payload / Arguments:</label>
            <input type="text" id="payload-input" value='{"limit": 5, "priority": "high", "scope": "full", "content": "Sovereignty operational check", "tag": "core"}'>
        </div>
    </div>

    <div class="card">
        <h3>Agent Control Panel</h3>
        <div style="display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap;">
            <button onclick="sendAgentCommandWithPayload('System', 'ping')">Ping System</button>
            <button onclick="sendAgentCommandWithPayload('FileAgent', 'list_dir')">List Files</button>
            <button onclick="sendAgentCommandWithPayload('FileAgent', 'export_logs')">Export Audit Logs</button>
            <button onclick="sendAgentCommandWithPayload('DatabaseAgent', 'query_logs')">View Audit Logs</button>
            <button onclick="sendAgentCommandWithPayload('SearchAgent', 'web_search', {query: 'Aethel orchestrator'})">Search Web</button>
            <button onclick="sendAgentCommandWithPayload('WorkerAgent', 'dispatch_job', {task: 'heavy_sync', priority: 'high'})">Dispatch Worker</button>
            <button onclick="sendAgentCommandWithPayload('ConfigAgent', 'get_config')">Get Config</button>
            <button onclick="sendAgentCommandWithPayload('MemoryAgent', 'store_memory', {content: 'Core architecture deployed', tag: 'milestone'})">Store Memory</button>
            <button onclick="sendAgentCommandWithPayload('MemoryAgent', 'recall_context')">Recall Memory</button>
            <button onclick="sendAgentCommandWithPayload('AnalyticsAgent', 'get_metrics')">Get Analytics</button>
        </div>
    </div>

    <div class="card">
        <h3>Local LLM Control</h3>
        <div style="display: flex; gap: 10px; margin-bottom: 10px; flex-direction: column;">
            <input type="text" id="llm-prompt" value="Summarize the core objectives of Aethel.">
            <button onclick="triggerLLM()">Query Local LLM</button>
        </div>
    </div>

    <div class="card">
        <h3>Semantic Vector Search</h3>
        <div style="display: flex; gap: 10px; margin-bottom: 10px; flex-direction: column;">
            <input type="text" id="vector-query" value="sovereignty status">
            <button onclick="triggerVectorSearch()">Execute Semantic Search</button>
        </div>
    </div>

    <div class="card">
        <h3>Live Output Stream & Broadcast Feed</h3>
        <pre id="output">Initializing WebSocket connection...</pre>
    </div>

    <script>
        const ws = new WebSocket("ws://127.0.0.1:8765");
        const output = document.getElementById("output");
        let commandCount = 0;
        let startTime = 0;
        let connectionStartTime = Date.now();

        setInterval(() => {
            if (document.getElementById("stat-conn").innerText === "Online") {
                const secondsElapsed = Math.floor((Date.now() - connectionStartTime) / 1000);
                const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
                const secs = String(secondsElapsed % 60).padStart(2, '0');
                document.getElementById("stat-uptime").innerText = `${mins}:${secs}`;
            }
        }, 1000);

        ws.onopen = () => {
            connectionStartTime = Date.now();
            document.getElementById("stat-conn").innerText = "Online";
            output.innerText = "Connected to Aethel Orchestrator. Listening for broadcasts...";
        };

        ws.onmessage = (event) => {
            const res = JSON.parse(event.data);
            
            // Handle asynchronous broadcast events separately from direct response payloads
            if (res.event) {
                const timestamp = new Date().toLocaleTimeString();
                output.innerText = `[BROADCAST @ ${timestamp}] ${JSON.stringify(res, null, 2)}\n\n` + output.innerText;
                return;
            }

            const latency = Date.now() - startTime;
            document.getElementById("stat-latency").innerText = latency + "ms";
            output.innerText = JSON.stringify(res, null, 2);
        };

        ws.onerror = (error) => {
            document.getElementById("stat-conn").innerText = "Error";
            output.innerText = "WebSocket Error: " + JSON.stringify(error);
        };

        function getDynamicPayload(fallback = {}) {
            try {
                const raw = document.getElementById("payload-input").value;
                return JSON.parse(raw);
            } catch (e) {
                return fallback;
            }
        }

        function sendAgentCommand(agent, action, payload = {}) {
            startTime = Date.now();
            commandCount++;
            document.getElementById("stat-count").innerText = commandCount;
            const message = JSON.stringify({ agent, action, payload });
            ws.send(message);
            output.innerText = `Dispatched -> Agent: ${agent} | Action: ${action}`;
        }

        function sendAgentCommandWithPayload(agent, action, defaultPayload = {}) {
            const customPayload = getDynamicPayload(defaultPayload);
            for (const key in defaultPayload) {
                if (!(key in customPayload)) {
                    customPayload[key] = defaultPayload[key];
                }
            }
            sendAgentCommand(agent, action, customPayload);
        }

        function triggerLLM() {
            const promptText = document.getElementById("llm-prompt").value;
            sendAgentCommand('LLMAgent', 'generate', { prompt: promptText, model: 'llama3' });
        }

        function triggerVectorSearch() {
            const queryText = document.getElementById("vector-query").value;
            const customPayload = getDynamicPayload({ query: queryText, top_k: 2 });
            customPayload.query = queryText;
            sendAgentCommand('VectorAgent', 'semantic_search', customPayload);
        }
    </script>
</body>
</html>
