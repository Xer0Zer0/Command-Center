<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aethel UI - Digital Contents</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #05050a;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            position: relative;
            background-image: radial-gradient(circle at 50% 80%, #0d1224 0%, #05050a 70%);
        }
        /* Top Navigation Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            z-index: 10;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .menu-icon, .close-icon {
            font-size: 20px;
            cursor: pointer;
            color: #e2e8f0;
        }
        .title-dropdown {
            font-size: 16px;
            font-weight: 500;
            color: #f8fafc;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        .title-dropdown::after {
            content: "⌄";
            font-size: 14px;
            color: #94a3b8;
        }
        /* Badge Indicator */
        .badge-indicator {
            width: 54px;
            height: 54px;
            background: linear-gradient(135deg, #be185d 0%, #831843 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(190, 24, 93, 0.4);
        }
        /* Main Content Workspace */
        .workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        /* Bottom Action Panel / Drawer */
        .bottom-panel {
            background-color: rgba(18, 20, 28, 0.85);
            backdrop-filter: blur(20px);
            border-top-left-radius: 28px;
            border-top-right-radius: 28px;
            padding: 16px 20px 24px 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }
        .drag-handle {
            width: 40px;
            height: 4px;
            background-color: rgba(255, 255, 255, 0.25);
            border-radius: 2px;
            margin: 0 auto 16px auto;
        }
        /* Quick Action Icon Row */
        .action-icons-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        .action-icon-card {
            background-color: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            padding: 16px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .action-icon-card:active {
            background-color: rgba(255, 255, 255, 0.08);
        }
        .action-icon-card svg {
            width: 24px;
            height: 24px;
            fill: #f1f5f9;
        }
        .action-icon-card span {
            font-size: 12px;
            color: #cbd5e1;
        }
        /* List Options */
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 12px;
        }
        .option-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 10px 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .option-item:active {
            background-color: rgba(255, 255, 255, 0.05);
        }
        .option-icon-box {
            width: 36px;
            height: 36px;
            background-color: rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .option-icon-box svg {
            width: 18px;
            height: 18px;
            fill: #e2e8f0;
        }
        .option-text h4 {
            font-size: 14px;
            font-weight: 500;
            color: #f8fafc;
        }
        .option-text p {
            font-size: 12px;
            color: #94a3b8;
        }
        /* Bottom Bar / Input Row */
        .bottom-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 16px;
        }
        .input-pill {
            flex: 1;
            background-color: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .input-pill span {
            color: #64748b;
            font-size: 14px;
        }
        .pill-buttons {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .pill-buttons svg {
            width: 20px;
            height: 20px;
            fill: #94a3b8;
            cursor: pointer;
        }
        .send-btn {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            border-radius: 50%;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }
        .send-btn svg {
            width: 20px;
            height: 20px;
            fill: #ffffff;
        }
        /* Home Indicator Bar */
        .home-indicator {
            width: 120px;
            height: 4px;
            background-color: rgba(255, 255, 255, 0.3);
            border-radius: 2px;
            margin: 8px auto 4px auto;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="header-left">
            <span class="close-icon">✕</span>
            <div class="title-dropdown">Digital Contents</div>
        </div>
        <div class="badge-indicator">69</div>
    </header>

    <!-- Workspace Area -->
    <div class="workspace">
        <!-- Center space can host dynamic content or state cards -->
    </div>

    <!-- Bottom Action Sheet / Drawer -->
    <div class="bottom-panel">
        <div class="drag-handle"></div>

        <!-- Top Grid Icons -->
        <div class="action-icons-grid">
            <div class="action-icon-card">
                <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
                <span>Photos</span>
            </div>
            <div class="action-icon-card">
                <svg viewBox="0 0 24 24"><path d="M12 15c1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3 1.34 3 3 3zm9-9h-3.17L15 3H9L7.17 6H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-9 13c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg>
                <span>Camera</span>
            </div>
            <div class="action-icon-card">
                <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
                <span>Files</span>
            </div>
            <div class="action-icon-card">
                <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
                <span>Note</span>
            </div>
        </div>

        <!-- Detailed List Options -->
        <div class="options-list">
            <div class="option-item">
                <div class="option-icon-box">
                    <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
                </div>
                <div class="option-text">
                    <h4>Images</h4>
                    <p>Create and edit</p>
                </div>
            </div>
            <div class="option-item">
                <div class="option-icon-box">
                    <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
                </div>
                <div class="option-text">
                    <h4>Music</h4>
                    <p>Make audio tracks</p>
                </div>
            </div>
            <div class="option-item">
                <div class="option-icon-box">
                    <svg viewBox="0 0 24 24"><path d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4h-4z"/></svg>
                </div>
                <div class="option-text">
                    <h4>Videos</h4>
                    <p>Create and edit</p>
                </div>
            </div>
        </div>

        <!-- Bottom Input & Controls -->
        <div class="bottom-bar">
            <div class="input-pill">
                <span>Ask anything...</span>
                <div class="pill-buttons">
                    <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                </div>
            </div>
            <button class="send-btn">
                <svg viewBox="0 0 24 24"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
            </button>
        </div>

        <div class="home-indicator"></div>
    </div>

</body>
    </html>
