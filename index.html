<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aethel</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #111111;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        /* Top Navigation Header */
        header {
            display: flex;
            align-items: center;
            padding: 16px;
            gap: 16px;
            border-bottom: 1px solid #f0f0f0;
        }

        .menu-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .menu-btn span {
            display: block;
            width: 20px;
            height: 2px;
            background-color: #111111;
        }

        h1 {
            font-size: 18px;
            font-weight: 500;
        }

        /* Bottom Floating Operations & Prompt Dock */
        .dock-container {
            padding: 12px 16px 24px 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #ffffff;
        }

        /* Operations Tray */
        .operations-tray {
            background: #f8f9fa;
            border-radius: 20px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            border: 1px solid #f1f3f5;
        }

        .operations-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            font-weight: 600;
            color: #8e8e93;
            letter-spacing: 0.5px;
            padding: 0 4px;
        }

        .tray-handle {
            width: 32px;
            height: 3px;
            background-color: #d1d5db;
            border-radius: 2px;
            align-self: center;
            margin-bottom: 4px;
        }

        .operations-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .op-card {
            background: #ffffff;
            border-radius: 14px;
            padding: 10px 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            border: 1px solid #edf2f7;
            transition: all 0.2s ease;
        }

        .op-card:active {
            transform: scale(0.96);
            background: #f1f3f5;
        }

        /* Agent Icon Shell with Fixed Cropping */
        .op-icon-shell {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f1f3f5;
            position: relative;
        }

        .op-icon-shell img {
            width: 130%;
            height: 130%;
            object-fit: cover;
            object-position: center;
        }

        .op-label {
            font-size: 12px;
            font-weight: 400;
            color: #374151;
        }

        /* Ask Aethel Input Bar */
        .prompt-bar {
            display: flex;
            align-items: center;
            background: #f8f9fa;
            border-radius: 28px;
            padding: 8px 12px 8px 16px;
            border: 1px solid #f1f3f5;
            gap: 8px;
        }

        .prompt-bar input {
            flex: 1;
            border: none;
            background: transparent;
            font-size: 15px;
            color: #111111;
            outline: none;
        }

        .prompt-bar input::placeholder {
            color: #9ca3af;
        }

        .action-icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            color: #6b7280;
        }

        .action-icon-btn:active {
            background: #e5e7eb;
        }

        .mic-waveform {
            display: flex;
            align-items: center;
            gap: 2px;
            height: 14px;
        }

        .mic-waveform span {
            display: block;
            width: 2px;
            background-color: #3b82f6;
            border-radius: 1px;
        }

        .mic-waveform span:nth-child(1) { height: 8px; }
        .mic-waveform span:nth-child(2) { height: 14px; }
        .mic-waveform span:nth-child(3) { height: 10px; }
        .mic-waveform span:nth-child(4) { height: 6px; }
    </style>
</head>
<body>

    <!-- Top Navigation -->
    <header>
        <button class="menu-btn" aria-label="Menu">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <h1>Aethel</h1>
    </header>

    <!-- Center Workspace Area (Blank canvas for application views) -->
    <main></main>

    <!-- Bottom Dock -->
    <div class="dock-container">
        
        <!-- Operations Tray -->
        <div class="operations-tray">
            <div class="tray-handle"></div>
            <div class="operations-header">
                <span>OPERATIONS</span>
            </div>
            <div class="operations-grid">
                
                <!-- Agents Icon with Custom Cropped Image -->
                <div class="op-card">
                    <div class="op-icon-shell">
                        <img src="./1000007111.png" alt="Agents Logo">
                    </div>
                    <span class="op-label">Agents</span>
                </div>

                <!-- Camera -->
                <div class="op-card">
                    <div class="op-icon-shell" style="background: #eef2ff;">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4f46e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                    </div>
                    <span class="op-label">Camera</span>
                </div>

                <!-- Media -->
                <div class="op-card">
                    <div class="op-icon-shell" style="background: #fef3c7;">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                    </div>
                    <span class="op-label">Media</span>
                </div>

                <!-- Storage -->
                <div class="op-card">
                    <div class="op-icon-shell" style="background: #f0fdf4;">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                    </div>
                    <span class="op-label">Storage</span>
                </div>

            </div>
        </div>

        <!-- Ask Aethel Input Bar -->
        <div class="prompt-bar">
            <button class="action-icon-btn" aria-label="Close">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
            <input type="text" placeholder="Ask Aethel">
            <button class="action-icon-btn" aria-label="Voice input">
                <div class="mic-waveform">
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </button>
            <button class="action-icon-btn" aria-label="Submit" style="color: #3b82f6;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </button>
        </div>

    </div>

</body>
    </html>
