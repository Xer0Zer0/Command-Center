name: Deploy to Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Run Bash Validation Tests
        run: |
          echo "=== Starting Bash Testing Suite ==="
          
          # Test 1: Verify that index.html exists
          if [ ! -f "index.html" ]; then
            echo "::error::index.html is missing!"
            exit 1
          else
            echo "✓ index.html found."
          fi
          
          # Test 2: Check for empty files
          find . -maxdepth 2 -type f -empty | while read file; do
            echo "::warning::Found empty file: $file"
          done
          
          echo "=== All Bash tests passed successfully! ==="

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
